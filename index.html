<title>EnerSite Job Brief</title>
<style>
:root{--o:#f47a20;--b:#171717;--m:#686866;--l:#dddcd6;--bg:#f4f4f1;--g:#1f7a52;--r:#b9342f;--y:#8a6514}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--b)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}

.ey{font-size:11px;color:#d8610e;text-transform:uppercase;font-weight:900;letter-spacing:1.3px}.muted{color:var(--m)}h2{font-size:29px;margin:6px 0 18px;letter-spacing:-.8px}h3{margin:0}.f{display:grid;gap:6px;margin:11px 0}.f label{font-size:12px;font-weight:800}.f input,.f textarea,.f select{border:1px solid #cfcfc9;border-radius:10px;padding:11px 12px;background:#fff;width:100%;outline:none}.f textarea{min-height:92px;resize:vertical}.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--o);box-shadow:0 0 0 3px #f47a2020}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:850}.primary{background:var(--o);color:#171717}.dark{background:#171717;color:#fff}.outline{background:#fff;border:1px solid var(--l)}.danger{background:#fff;border:1px solid #edb8b5;color:#a42f2a}.wide{width:100%}.small{padding:8px 10px;font-size:12px}.msg{background:#fff0ee;color:#992d27;padding:10px;border-radius:9px;margin:10px 0}.warn{background:#fff7df;border:1px solid #ead9a4;padding:11px;border-radius:9px;color:#725709;font-size:12px;line-height:1.45}.ok{background:#eaf6ef;border:1px solid #bfdfcd;padding:11px;border-radius:9px;color:#176842;font-size:12px}
.top{height:64px;background:#171717;color:#fff;border-bottom:3px solid var(--o);display:flex;align-items:center;padding:0 max(16px,calc((100vw - 1120px)/2));position:sticky;top:0;z-index:20}.top .brand{font-size:22px}.nav{margin-left:auto;display:flex;gap:3px}.nav button{border:0;background:transparent;color:#aaa;padding:10px;border-radius:8px;font-weight:800}.nav button.on{background:#2c2c2c;color:#fff}.page{max-width:1120px;margin:auto;padding:27px 16px 96px}.head{display:flex;gap:14px;align-items:end;margin-bottom:20px}.head>div{flex:1}.head h1{font-size:31px;margin:4px 0;letter-spacing:-1px}.sub{color:var(--m)}
.hero2{background:#1c1c1c;color:#fff;border-radius:16px;padding:22px;display:flex;align-items:center;gap:18px}.hero2>div{flex:1}.hero2 h3{font-size:23px;margin:5px 0}.hero2 p{color:#bbb;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0 24px}.stat,.card{background:#fff;border:1px solid var(--l);border-radius:13px}.stat{padding:15px}.stat b{display:block;font-size:28px}.stat span{font-size:11px;text-transform:uppercase;color:var(--m);font-weight:800}.list{display:grid;gap:9px}.row{background:#fff;border:1px solid var(--l);border-radius:11px;padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer}.row:hover{border-color:#bbb}.row>div{flex:1}.row b{display:block}.meta{font-size:11px;color:var(--m);margin-top:5px}.status{font-size:10px;font-weight:900;text-transform:uppercase;padding:6px 8px;border-radius:99px;background:#eee}.status.sent,.status.assigned,.status.viewed{background:#fff0dc;color:#985400}.status.completed,.status.acknowledged{background:#e8f5ee;color:#176842}.status.draft{background:#eee}.status.inactive{background:#fbe8e7;color:#9c2e29}
.formcard{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:12px}.sectiontitle{display:flex;align-items:center;gap:10px;margin-bottom:12px}.step{width:28px;height:28px;border-radius:8px;background:#171717;color:#fff;display:grid;place-items:center;font-weight:900}.sectiontitle h3{font-size:18px}.sectiontitle small{display:block;color:var(--m);font-weight:500;margin-top:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}.full{grid-column:1/-1}.check{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.check label,.personcheck{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--l);border-radius:9px;padding:10px;background:#fafafa;font-size:12px}.check input,.personcheck input{accent-color:var(--o);margin-top:1px}.check label:has(input:checked),.personcheck:has(input:checked){border-color:#f2a56d;background:#fff7f0}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #ccc;background:#fff;border-radius:99px;padding:9px 11px;font-size:11px;font-weight:800}.chip.on{background:#171717;color:#fff;border-color:#171717}.minirow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;padding:10px 0;border-top:1px solid #eee}.minirow:first-child{border-top:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tripair{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.divider{height:1px;background:#eee;margin:14px 0}.exc{border:1px solid #d7d7d1;border-radius:12px;padding:14px;margin-top:10px;background:#fcfcfa}.excHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.excHead b{font-size:15px}.excHead .spacer{flex:1}.ref{font-size:11px;color:#575752;line-height:1.5;background:#f7f7f3;border-left:4px solid #c6c6be;padding:11px;margin-top:10px;border-radius:7px}.actions{position:sticky;bottom:10px;background:#ffffffed;border:1px solid v .recordbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--l);border-radius:13px;padding:13px 15px;margin-bottom:14px}.recordbar>div:first-child{flex:1}.recordbar b{display:block;font-size:15px}.recordbar small{display:block;color:var(--m);margin-top:3px}.recordstamp{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;border-radius:999px;padding:7px 10px;background:#eee}.recordstamp.complete{background:#e8f5ee;color:#176842}.recordstamp.pending{background:#fff0dc;color:#985400}.recordstamp.draft{background:#eee;color:#555}.dochead{display:flex;align-items:flex-start;gap:18px;border-bottom:3px solid #171717;padding:0 0 12px;margin-bottom:13px}.dochead .brand{font-size:28px}.docheadmain{flex:1}.docheadmain h2{font-size:20px;margin:1px 0 3px}.docheadmain p{margin:0;color:#555;font-size:11px}.docmeta{text-align:right;font-size:10px;color:#555;line-height:1.45}.acktable{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.acktable th,.acktable td{border:1px solid #cfcfc9;padding:8px;vertical-align:top;text-align:left}.acktable th{background:#f1f1ed;font-size:10px;text-transform:uppercase;letter-spacing:.4px}.sigline{font-family:"Segoe Script","Bradley Hand",cursive;font-size:14px}.recordfoot{display:none;font-size:9px;color:#666;border-top:1px solid #aaa;margin-top:16px;padding-top:7px}.screenrecord{display:block}.printrecord{display:none}.completebox{background:#eaf6ef;border:1px solid #bfdfcd;border-radius:10px;padding:11px 12px;margin:10px 0;color:#176842;font-size:12px}.pendingbox{background:#fff7df;border:1px solid #ead9a4;border-radius:10px;padding:11px 12px;margin:10px 0;color:#725709;font-size:12px}.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.photoitem{border:1px solid var(--l);border-radius:10px;overflow:hidden;background:#fafafa}.photoitem img{display:block;width:100%;height:145px;object-fit:cover;background:#eee}.photoitem .photometa{padding:8px;font- @media(max-width:760px){.auth{grid-template-columns:1fr}.hero{display:none}.nav{display:none}.mobile{display:grid}.grid,.grid3,.detail,.check,.tripair{grid-template-columns:1fr}.photogrid{grid-template-columns:repeat(2,1fr)}.photoitem img{height:125px}.full{grid-column:auto}.stats{grid-template-columns:repeat(3,1fr)}.page{padding-bottom:105px}.hero2{display:block}.hero2 .btn{width:100%;margin-top:15px}.head{align-items:center}.head h1{font-size:27px}.head .btn{white-space:nowrap}.kv{grid-template-columns:1fr}.kv b{margin-top:6px}.actions{bottom:68px}.exc{padding:12px}.pair{grid-template-columns:1fr 1fr}}
@media print{@page{size:letter;margin:.42in .48in}body{background:#fff;color:#000;font-size:10px}.top,.mobile,.head,.actions,.noprint,.modalback,.toast,.screenrecord{display:none!important}.printrecord,.printtitle,.recordfoot{display:block!important}.page{max-width:none;padding:0;margin:0}.detail{display:block}.detail>div.card{border:0!important;padding:0!important}.detail aside{border:0!important;padding:0!important;page-break-before:auto}.card,.formcard{border:0;box-shadow:none}.detail .section{padding:8px 0;border-top:1px solid #bbb;break-inside:avoid}.detail .section h3{font-size:12px;margin-bottom:4px}.tag{background:#fff;border:1px solid #aaa;padding:3px 5px;margin:2px;font-size:9px}.kv{grid-template-columns:145px 1fr;gap:3px 8px;margin:5px 0;font-size:9.5px}.kv b{color:#333}.ref{font-size:8.5px;padding:7px;margin-top:7px;border-left-width:3px}.dochead{margin-bottom:8px}.dochead .brand{font-size:23px}.docheadmain h2{font-size:16px;margin:0}.docmeta{font-size:8.5px}.recordbar{display:none}.acktable{font-size:9px}.acktable th,.acktable td{padding:5px}.acktable th{font-size:8px}.people{display:none}.recordfoot{display:block!important}.printbreak{break-before:page}.exc{break-inside:avoid}.photogrid{grid-template-columns:repeat(2,1fr);gap:7px}.photoitem{break-inside:avoid}.photoitem img{height:170px}.photoitem .photobar{display:none}.photoitem .photometa{font-size:8px;padding:5px}.printtitle{display:none!important}}
.printtitle{display:none}

.attention{background:#fff7ed;border:1px solid #f2c596;border-left:5px solid var(--o);border-radius:14px;padding:14px;margin:0 0 16px}.attention.supervisor{background:#fff;border-color:#ddd;border-left-color:#2b2b2b}.attentiontop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}.attentiontop h3{margin:2px 0 0;font-size:17px}.attentioncount{display:grid;place-items:center;min-width:34px;height:34px;border-radius:18px;background:var(--o);color:#fff;font-weight:800}.attention.supervisor .attentioncount{background:#2b2b2b}.list.compact .row{padding:10px 12px}.noticebar{background:#fff;border:1px solid #ddd;border-radius:10px;padding:11px 13px;margin:0 0 16px;font-weight:600}
</style>
